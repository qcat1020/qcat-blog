<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCat Blog</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
        }
        header {
            background-color: #333;
            color: white;
            padding: 20px;
            font-size: 24px;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .post {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .post h2 {
            margin: 0;
            color: #333;
        }
        .post p {
            color: #666;
        }
        .write-button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }
        .write-button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <header>QCat Blog</header>
    <div class="container">
        <h2>Welcome to My Blog</h2>
        <p>This is where I practice my writing and share some translation pieces.</p>
        <button class="write-button" onclick="location.href='/admin/'">Write a Blog Post</button>
    </div>
    <script>
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", (user) => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/admin/";
                    });
                }
            });
        }
    </script>
</body>
</html>
